# fly.toml app configuration file generated for haushalt-api on 2026-09-06T16:01:55+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'haushalt-api'
primary_region = 'fra'

[build]

[env]
  PORT = '8080'
  APP_ENV = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Fly fragt diesen Endpunkt regelmäßig ab und nimmt eine Maschine aus dem
  # Verkehr, die 503 liefert — etwa wenn die Datenbank weg ist.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
