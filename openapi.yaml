openapi: 3.0.3

info:
  title: Haushalt API
  version: 0.1.0
  description: |
    Der Vertrag zwischen der Web-App und dem Go-Dienst.

    Diese Datei ist die Wahrheit: Go-Typen und Server-Rümpfe werden daraus
    erzeugt (`make generate` in `api/`), der TypeScript-Client ebenso
    (`npm run generate` in `web/`). Wer ein Feld ändert, ändert es hier —
    alles andere folgt.

    Feldnamen sind deutsch und in Kleinschreibung mit Unterstrich, wie in
    der Vorlagen-Bibliothek. Die Domäne ist deutsch; eine halb übersetzte
    API wäre in beiden Sprachen falsch.

    `/healthz` steht bewusst nicht hier. Es gehört der Plattform, nicht dem
    Vertrag: Fly ruft es auf, kein Client.

servers:
  - url: https://haushalt-api.fly.dev
    description: Produktion
  - url: http://localhost:8080
    description: lokal

tags:
  - name: plan
    description: Wochenpläne
  - name: haushalt
    description: Mitgliedschaft und Einladungen
  - name: meta
    description: Auskunft über den laufenden Dienst

paths:
  /api/version:
    get:
      tags: [meta]
      summary: Welcher Stand läuft gerade
      operationId: getVersion
      responses:
        "200":
          description: die Commit-Kennung des laufenden Dienstes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"

  /api/ich:
    get:
      tags: [meta]
      summary: Wer fragt
      description: |
        Beantwortet, was das mitgeschickte Token beweist — und nicht mehr.
        Ohne Token ist `angemeldet` false; das ist kein Fehler, sondern die
        Antwort. Die Demo-Haushalte sind ohne Anmeldung sichtbar.
      operationId: getIch
      responses:
        "200":
          description: die Identität des Aufrufers, soweit belegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ich"

  /api/haushalte:
    get:
      tags: [plan]
      summary: Verfügbare Haushalte
      description: |
        Die öffentlichen Beispielhaushalte und, wer angemeldet ist, die
        eigenen. Nur bei den eigenen ist `meine_rolle` gesetzt — eine Liste
        ohne einen solchen Eintrag heißt: dieser Mensch hat noch keinen
        Haushalt und gehört ins Onboarding.
      operationId: listHaushalte
      responses:
        "200":
          description: alle sichtbaren Haushalte
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Haushalt"

    post:
      tags: [haushalt]
      summary: Haushalt einrichten
      description: |
        Legt einen Haushalt samt Mitgliedern an und macht den Aufrufer darin
        planend. Alles in einem Aufruf und in einer Transaktion: Ein
        Onboarding, das nach dem zweiten Schritt abbricht, darf keinen halben
        Haushalt hinterlassen.

        Gefragt wird nur, was der Planer wirklich braucht — Wohnform, Personen
        mit grobem Alter, Zeitbudget. Alles Weitere ist Vorgabe und später
        änderbar. Eine App gegen Mental Load darf beim Einrichten keine
        erzeugen.
      operationId: createHaushalt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NeuerHaushalt"
      responses:
        "201":
          description: der angelegte Haushalt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Haushalt"
        "400":
          description: die Eingabe ergibt keinen Haushalt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "401":
          description: dafür muss man angemeldet sein
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/haushalte/{haushaltId}/mitglieder/{mitgliedId}:
    patch:
      tags: [haushalt]
      summary: Eine Person ändern
      description: |
        Den eigenen Namen und die eigene Zeit setzt jeder selbst — wie viel
        Zeit jemand hat, weiß nur er. Rolle und Geburtsjahr ändern die
        planenden Personen, denn daran hängt, was jemand im Haushalt darf und
        welche Aufgaben er überhaupt bekommen kann.

        Was fehlt, bleibt stehen. Zurück kommt der ganze Haushalt, damit die
        Ansicht nicht raten muss, was sich sonst noch geändert hat.
      operationId: updateMitglied
      parameters:
        - name: haushaltId
          in: path
          required: true
          schema:
            type: string
        - name: mitgliedId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MitgliedAenderung"
      responses:
        "200":
          description: der Haushalt, wie er jetzt aussieht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Haushalt"
        "400":
          description: die Änderung ergibt keine Person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "403":
          description: das dürfen die planenden Personen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: diesen Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/haushalte/{haushaltId}/plan/{woche}/neu:
    post:
      tags: [plan]
      summary: Woche neu rechnen
      description: |
        Rechnet eine festgeschriebene Woche noch einmal — nach einer Änderung
        an den Einstellungen, oder wenn jemand dazugekommen ist.

        **Was Spuren hinterlassen hat, bleibt.** Aufgaben mit einem Ereignis —
        abgehakt, abgegeben, wieder geöffnet — werden nicht angefasst. Alles
        andere war ein Vorschlag und wird ersetzt.

        Nur planende Personen: Der Plan gehört dem Haushalt, nicht dem, der
        gerade unzufrieden damit ist.
      operationId: wocheNeuRechnen
      parameters:
        - name: haushaltId
          in: path
          required: true
          schema:
            type: string
        - name: woche
          in: path
          required: true
          schema:
            type: string
          example: 2026-W38
      responses:
        "200":
          description: die neu gerechnete Woche
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wochenplan"
        "400":
          description: das ist keine Kalenderwoche
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "403":
          description: das dürfen die planenden Personen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: diesen Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/haushalte/{haushaltId}/plan/{woche}:
    get:
      tags: [plan]
      summary: Wochenplan eines Haushalts
      operationId: getWochenplan
      parameters:
        - name: haushaltId
          in: path
          required: true
          description: Kennung des Haushalts, z. B. `familie-a`
          schema:
            type: string
        - name: woche
          in: path
          required: true
          description: ISO-Kalenderwoche, Montag als erster Tag
          schema:
            type: string
            pattern: '^\d{4}-W\d{2}$'
            example: 2026-W38
      responses:
        "200":
          description: der berechnete Plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wochenplan"
        "400":
          description: die Woche ist nicht lesbar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: diesen Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/haushalte/{haushaltId}:
    patch:
      tags: [haushalt]
      summary: Einstellungen des Haushalts ändern
      description: |
        Nur planende Personen. Was hier steht, entscheidet, welche Aufgaben es
        im Haushalt überhaupt gibt — „kein Garten" nimmt das Rasenmähen für
        alle aus dem Plan.

        Gilt ab der nächsten Woche. Die laufende steht fest (ADR-0008) und
        wird nur auf Zuruf neu gerechnet.
      operationId: updateHaushalt
      parameters:
        - name: haushaltId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HaushaltAenderung"
      responses:
        "200":
          description: der Haushalt, wie er jetzt aussieht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Haushalt"
        "400":
          description: die Änderung ergibt keinen Haushalt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "403":
          description: das dürfen die planenden Personen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: diesen Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/haushalte/{haushaltId}/vorlagen:
    get:
      tags: [haushalt]
      summary: Alles, was die App kennt — und was davon bei euch gilt
      description: |
        Die ganze Bibliothek mit dem Stand dieses Haushalts. Jede Zeile sagt,
        ob sie gilt, und wenn nicht, warum: nicht zuständig, noch ungeklärt,
        braucht einen Termin, abgewählt.

        Der Grund für diese Liste: Ein Plan, dem man nicht widersprechen kann,
        ist eine Behauptung. Hier lässt sich jede Zeile umdrehen.
      operationId: listVorlagen
      parameters:
        - name: haushaltId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: die Bibliothek, auf diesen Haushalt bezogen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VorlagenStand"
        "404":
          description: diesen Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

    post:
      tags: [haushalt]
      summary: Eine eigene Aufgabe anlegen
      description: |
        Für alles, was in der Bibliothek fehlt — die Medikamente der
        Großmutter, der Putzplan der WG, das Vereinstraining.

        Bewusst wenige Felder: Eine eigene Aufgabe anzulegen ist Dateneingabe,
        und Dateneingabe ist das, wogegen das Produkt antritt. Sie ist der
        Ausweg für das Fehlende, nicht der Weg.

        Die Kopflast wird nicht als Zahl abgefragt, sondern aus zwei Fragen
        abgeleitet, die man ohne Kenntnis des Modells beantworten kann.
      operationId: createEigeneVorlage
      parameters:
        - name: haushaltId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NeueVorlage"
      responses:
        "201":
          description: die angelegte Aufgabe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VorlagenStand"
        "400":
          description: das ergibt keine Aufgabe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "403":
          description: das dürfen die planenden Personen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: diesen Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/haushalte/{haushaltId}/vorlagen/{vorlageId}:
    patch:
      tags: [haushalt]
      summary: Eine Vorlage abbestellen oder wieder anbestellen
      description: |
        „Das machen wir nicht" — dauerhaft. Die Vorlage verschwindet aus allen
        künftigen Plänen, bis jemand sie wieder anbestellt.

        Das ist die einfachste Form der Lernschleife und die wichtigste: Ohne
        sie kann der Haushalt dem Vorschlag nur folgen oder ihn jede Woche neu
        wegklicken.

        Nur planende Personen — es gilt für alle.
      operationId: setVorlage
      parameters:
        - name: haushaltId
          in: path
          required: true
          schema:
            type: string
        - name: vorlageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aktiv]
              properties:
                aktiv:
                  type: boolean
      responses:
        "204":
          description: eingetragen
        "403":
          description: das dürfen die planenden Personen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: diesen Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/haushalte/{haushaltId}/absprachen/{vorlageId}:
    put:
      tags: [haushalt]
      summary: Wochenraster einer Vorlage setzen
      description: |
        Wer an welchem Wochentag. Alle sieben Plätze auf einmal, Index 0 ist
        Montag; ein leerer Eintrag heißt „für diesen Tag ist nichts
        abgesprochen".

        **Der Planer verteilt diese Aufgaben nicht.** Er verteilt nach
        Kapazität — wie viel Zeit jemand hat. Wer ein Kind um 7:45 in die Kita
        bringen kann, hängt dagegen am Arbeitsplan, und den kennt die App
        nicht. Ohne Absprache würde sie mit voller Überzeugung den Falschen
        einteilen; deshalb wird hier nicht geraten, sondern gefragt.

        Die Absprache gilt, bis jemand sie ändert — „diese Woche wie letzte"
        ist damit der Normalfall. Eine einzelne Ausnahme ist `zuteilen` und
        betrifft nur den einen Termin.

        Nur planende Personen: Eine Absprache ist eine Vereinbarung über andere
        Menschen.
      operationId: setAbsprache
      parameters:
        - name: haushaltId
          in: path
          required: true
          schema:
            type: string
        - name: vorlageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wochentage]
              properties:
                wochentage:
                  type: array
                  minItems: 7
                  maxItems: 7
                  items:
                    type: string
                  description: |
                    Sieben Kennungen von Mitgliedern, Index 0 = Montag. Leerer
                    Text heißt: für diesen Tag ist nichts abgesprochen.
      responses:
        "204":
          description: gesetzt
        "400":
          description: so geht das nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "403":
          description: das dürfen die planenden Personen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: den Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/haushalte/{haushaltId}/absprachen/{vorlageId}/ab-heute:
    post:
      tags: [haushalt]
      summary: Die Absprache in die laufende Woche eintragen
      description: |
        Die laufende Woche steht fest, sobald sie das erste Mal angesehen
        wurde. Eine frisch gesetzte Absprache gilt deshalb ab der **nächsten**
        Woche von selbst — dieser Aufruf ist der Handgriff für „ab sofort".

        Er trägt **nur diese Vorlage** ein und **nur ab heute**. Bewusst nicht
        `plan/{woche}/neu`: Das Neurechnen verteilt die ganze Woche neu, und
        wer am Mittwoch eine Kita-Absprache einträgt, bekäme nebenbei eine
        neue Antwort darauf, wer am Freitag das Bad putzt. Ein Plan, der sich
        an Stellen ändert, die niemand angefasst hat, ist der Plan, dem
        niemand mehr glaubt.

        Was Spuren hinterlassen hat — abgehakt, abgegeben, gestrichen —,
        bleibt stehen. Vergangene Tage bleiben unberührt.

        Nur planende Personen.
      operationId: absprachAbHeute
      parameters:
        - name: haushaltId
          in: path
          required: true
          schema:
            type: string
        - name: vorlageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: eingetragen
          content:
            application/json:
              schema:
                type: object
                required: [eingetragen]
                properties:
                  eingetragen:
                    type: integer
                    description: |
                      Wie viele Termine entstanden sind. Null ist eine gültige
                      Antwort: An den verbleibenden Tagen steht schon etwas,
                      oder das Raster trifft in dieser Woche keinen fälligen
                      Tag mehr. Die Zahl geht mit hinaus, damit die Oberfläche
                      genau das sagen kann, statt „fertig" zu melden und
                      nichts zu zeigen.
        "403":
          description: das dürfen die planenden Personen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: den Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/haushalte/{haushaltId}/wochentage/{vorlageId}:
    put:
      tags: [haushalt]
      summary: An welchen Wochentagen eine Aufgabe liegt
      description: |
        Sieben Plätze, Index 0 ist Montag. **Alle sieben falsch setzt
        zurück** — dann gilt wieder der Rhythmus aus der Bibliothek.

        Der Fall: Müll rausbringen steht in der Bibliothek auf Dienstag, weil
        irgendein Tag dastehen musste. Bei euch kommt die Tonne donnerstags.
        Bisher gab es dagegen ein einziges Mittel — die Vorlage abbestellen
        und von Hand neu anlegen, womit die Zahlen der Bibliothek verloren
        gehen und die Aufgabe als geschätzte „eigene" dasteht.

        **Feste Tage schlagen jeden anderen Rhythmus.** Wer „donnerstags"
        sagt, meint nicht „alle sieben Tage, bevorzugt donnerstags". Damit
        ändert sich auch die Häufigkeit: Aus „alle 14 Tage" wird durch die
        Wahl eines Tages „wöchentlich, samstags". Das ist die Aussage und
        keine Nebenwirkung — die Oberfläche sagt es beim Setzen dazu.

        Nicht für jeden Rhythmus. Beim Auslöser („der Wäschekorb ist voll")
        ist ein Wochentag keine Antwort, sondern eine andere Frage; Saison und
        Phase laufen über Monate; und was an einem Anlass hängt, hat seinen
        Tag schon. Für die gibt es `400`.

        Nur planende Personen: Der Tag gilt für alle.
      operationId: setWochentage
      parameters:
        - name: haushaltId
          in: path
          required: true
          schema:
            type: string
        - name: vorlageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wochentage]
              properties:
                wochentage:
                  type: array
                  minItems: 7
                  maxItems: 7
                  items:
                    type: boolean
                  description: |
                    Index 0 = Montag. Alle sieben falsch heißt: zurück zum
                    Rhythmus der Bibliothek.
      responses:
        "204":
          description: gesetzt
        "400":
          description: diese Aufgabe hat keinen Wochenrhythmus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "403":
          description: das dürfen die planenden Personen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: den Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/haushalte/{haushaltId}/rueckmeldungen:
    get:
      tags: [haushalt]
      summary: Was der Haushalt gemeldet hat
      description: |
        Nur planende Personen. Melden darf jedes Mitglied, lesen nicht: In der
        Liste stehen Sätze über andere Menschen im selben Haushalt, und die
        gehören nicht an jede Pinnwand.
      operationId: listRueckmeldungen
      parameters:
        - name: haushaltId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: die letzten fünfzig
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rueckmeldung"
        "403":
          description: das dürfen die planenden Personen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: den Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
    post:
      tags: [haushalt]
      summary: Etwas melden
      description: |
        **Jedes Mitglied darf melden, nicht nur die planenden.** Die
        ausführenden Personen sehen die Stellen, an denen es klemmt, zuerst —
        sie bekommen den Plan, den sie nicht gemacht haben. Eine Meldefunktion
        nur für Planende meldet, was der Planende ohnehin weiß.

        `kontext` sammelt die Oberfläche selbst — Seite, Woche, Fassung. Wer
        erst beschreiben muss, wo er gerade war, meldet nichts.
      operationId: melden
      parameters:
        - name: haushaltId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [art, text]
              properties:
                art:
                  type: string
                  enum: [fehler, idee, stoert]
                text:
                  type: string
                  maxLength: 2000
                kontext:
                  type: string
                  maxLength: 500
      responses:
        "204":
          description: angekommen
        "400":
          description: so geht das nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "403":
          description: dafür musst du zum Haushalt gehören
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: den Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/haushalte/{haushaltId}/anlaesse:
    get:
      tags: [haushalt]
      summary: Die eingetragenen Anlässe
      operationId: listAnlaesse
      parameters:
        - name: haushaltId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: alle Anlässe des Haushalts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Anlass"
        "404":
          description: diesen Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
    post:
      tags: [haushalt]
      summary: Einen Anlass eintragen
      description: |
        Ein Geburtstag, ein Elternabend, ein Termin. Daran hängen die Aufgaben
        mit Vorlauf — „Geschenk besorgen, sieben Tage vorher".

        Ohne Anlass entsteht keine solche Aufgabe. Die App erfindet keinen
        Geburtstag (ADR-0010).
      operationId: createAnlass
      parameters:
        - name: haushaltId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NeuerAnlass"
      responses:
        "201":
          description: der eingetragene Anlass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anlass"
        "400":
          description: das ergibt keinen Anlass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "403":
          description: das dürfen die planenden Personen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: diesen Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/haushalte/{haushaltId}/anlaesse/{anlassId}:
    delete:
      tags: [haushalt]
      summary: Einen Anlass löschen
      operationId: deleteAnlass
      parameters:
        - name: haushaltId
          in: path
          required: true
          schema:
            type: string
        - name: anlassId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: gelöscht
        "403":
          description: das dürfen die planenden Personen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: diesen Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/haushalte/{haushaltId}/fakten:
    patch:
      tags: [haushalt]
      summary: Eine Frage zum Haushalt beantworten
      description: |
        Trägt ein, was der Haushalt hat und was nicht — Pflanzen, Spülmaschine,
        Keller. Was hier fehlt, bleibt **unbekannt**, und unbekannt ist nicht
        dasselbe wie nein: Unbekanntes wird nicht eingeplant, sondern gefragt.

        Zusammengeführt, nicht ersetzt: Eine Antwort löscht die übrigen nicht.

        Nur planende Personen. Ein Nein nimmt Aufgaben aus dem Plan aller.
      operationId: setFakten
      parameters:
        - name: haushaltId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: boolean
              example:
                pflanzen: false
                spuelmaschine: true
      responses:
        "200":
          description: der Haushalt, wie er jetzt aussieht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Haushalt"
        "400":
          description: das ergibt keine Antwort
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "403":
          description: das dürfen die planenden Personen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: diesen Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/haushalte/{haushaltId}/einladungen:
    post:
      tags: [haushalt]
      summary: Jemanden einladen
      description: |
        Erzeugt einen einmalig gültigen Code. Nur planende Personen dürfen das.

        Die Rolle wird beim Einladen festgelegt und nicht beim Beitritt: Wer
        dazukommt, soll nicht selbst entscheiden, was er im Haushalt darf.
      operationId: createEinladung
      parameters:
        - name: haushaltId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rolle:
                  type: string
                  enum: [planend, ausfuehrend]
                  description: |
                    Nötig, wenn jemand dazukommt, den es im Haushalt noch nicht
                    gibt. Zusammen mit `mitglied` wird sie ignoriert: Diese
                    Person hat ihre Rolle bereits, und der Plan rechnet damit.
                mitglied:
                  type: string
                  description: |
                    Kennung einer Person, die schon im Plan steht, aber noch
                    kein Konto hat. Der Code macht den Eingeladenen dann zu
                    genau dieser Person — mit ihren Aufgaben, ihrem Verlauf und
                    ihrer Kapazität, statt eine zweite gleichen Namens
                    anzulegen.
      responses:
        "201":
          description: der Code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Einladung"
        "403":
          description: nur planende Personen dürfen einladen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: diesen Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/aufgaben/{aufgabeId}/erledigt:
    post:
      tags: [plan]
      summary: Aufgabe abhaken oder wieder öffnen
      description: |
        Schreibt ein Ereignis ins Protokoll — keine Spalte auf der Aufgabe.
        Eine Spalte kennt nur den letzten Zustand, das Protokoll den Weg
        dahin, und die Rotation der Folgewoche liest diesen Weg.

        Erlaubt ist es der zuständigen Person und jeder planenden.
      operationId: setErledigt
      parameters:
        - name: aufgabeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                erledigt:
                  type: boolean
                  description: Fehlt das Feld, gilt „erledigt".
      responses:
        "204":
          description: eingetragen
        "403":
          description: das ist nicht deine Aufgabe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: diese Aufgabe gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/aufgaben/{aufgabeId}/abgeben:
    post:
      tags: [plan]
      summary: Aufgabe zurückgeben
      description: |
        Gibt die Aufgabe zurück in den Haushalt. Die App sucht nach denselben
        Regeln wie beim Zuteilen jemand anderen; findet sie niemanden, steht
        die Aufgabe offen da.

        Sie verschwindet nicht. Abgeben ist Handlungsmacht, nicht Löschen mit
        besserem Gewissen.
      operationId: aufgabeAbgeben
      parameters:
        - name: aufgabeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                grund:
                  type: string
                  maxLength: 200
                  description: |
                    Freiwillig. Landet im Protokoll und ist später die
                    ehrlichste Rückmeldung, die das Produkt bekommt: Wer
                    dieselbe Aufgabe dreimal mit derselben Begründung abgibt,
                    hat sie nie gewollt.
      responses:
        "200":
          description: abgegeben
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Abgabe"
        "403":
          description: das ist nicht deine Aufgabe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: diese Aufgabe gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/aufgaben/{aufgabeId}/streichen:
    post:
      tags: [plan]
      summary: Einen einzelnen Termin streichen
      description: |
        Nimmt **diesen einen Termin** aus dem Plan. Die Vorlage bleibt
        unangetastet, und ihre übrigen Termine derselben Woche auch: Kommt
        „Safiya zur Kita bringen" fünfmal vor, streicht das hier genau einen
        Tag.

        Der Unterschied zum Abschalten einer Vorlage ist die Reichweite, und er
        ist der Grund für diesen Endpunkt: Abschalten gilt für alle künftigen
        Wochen. Bis es das Streichen gab, war der einzige Ausweg aus einer
        Aufgabe eine Entscheidung über die Zukunft — und ein Fehlgriff nahm
        dem Haushalt eine Vorlage weg, die er eigentlich wollte.

        Gestrichenes verschwindet aus dem Plan und aus der Bilanz; es steht als
        `gestrichen` in der Antwort, damit die App einen Weg zurück anbieten
        kann.

        Erlaubt ist es der zuständigen Person und jeder planenden.
      operationId: aufgabeStreichen
      parameters:
        - name: aufgabeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                gestrichen:
                  type: boolean
                  description: |
                    Fehlt das Feld, gilt „gestrichen". `false` plant die
                    Aufgabe wieder ein.
      responses:
        "204":
          description: eingetragen
        "403":
          description: das ist nicht deine Aufgabe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: diese Aufgabe gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/aufgaben/{aufgabeId}/zuteilen:
    post:
      tags: [plan]
      summary: Aufgabe von Hand an eine Person geben
      description: |
        Der Unterschied zu `abgeben`: Dort sucht die App jemanden nach ihren
        Regeln, hier hat ein Mensch schon gewählt.

        Geprüft wird nur noch, was die Person nicht übernehmen *kann* — Alter,
        Rolle, Verteilungsregel der Vorlage, und dass eine eigene Aufgabe der
        Person selbst gehört. Was die App nur *bevorzugt* hätte — Rotation,
        Auslastung, Kopflast am Tag — gilt hier nicht. Ein Mensch, der es
        besser weiß, sticht die Annahmen des Planers.

        Jede Korrektur wird als `manual` festgehalten. Sie ist die ehrlichste
        Rückmeldung, die das Produkt bekommt: Sie sagt, wo der Planer
        danebenlag.

        Erlaubt ist es der zuständigen Person und jeder planenden.
      operationId: aufgabeZuteilen
      parameters:
        - name: aufgabeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mitglied]
              properties:
                mitglied:
                  type: string
                  description: Kennung der Person, die die Aufgabe übernimmt.
      responses:
        "200":
          description: umverteilt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zuteilung"
        "400":
          description: diese Person kann die Aufgabe nicht übernehmen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "403":
          description: das ist nicht deine Aufgabe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: diese Aufgabe gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/einladungen/{code}/annehmen:
    post:
      tags: [haushalt]
      summary: Einer Einladung folgen
      description: |
        Verbindet die angemeldete Person mit dem Haushalt aus der Einladung.
        Ein Code gilt einmal und läuft ab.
      operationId: acceptEinladung
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: der Haushalt, zu dem die Person jetzt gehört
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Haushalt"
        "401":
          description: dafür muss man angemeldet sein
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: den Code gibt es nicht, er ist abgelaufen oder verbraucht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

components:
  schemas:

    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: kurze Commit-Kennung oder "dev"
          example: f18a432

    Ich:
      type: object
      required: [angemeldet]
      description: |
        Absichtlich schmal: Hier steht nur, was der Aussteller signiert hat.
        Welche Person in welchem Haushalt dahintersteckt, ist eine Frage an die
        Datenbank und kommt mit dem Onboarding dazu.
      properties:
        angemeldet:
          type: boolean
        subject:
          type: string
          nullable: true
          description: Nutzerkennung des Anmeldedienstes
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true

    Fehler:
      type: object
      required: [fehler]
      properties:
        fehler:
          type: string
          description: für Menschen lesbar, deutsch
          example: die Woche "2026-W99" liegt außerhalb von 1..53

    Einladung:
      type: object
      required: [code, rolle, gueltig_bis]
      properties:
        code:
          type: string
          example: K7MQ2XPD
        rolle:
          type: string
          enum: [planend, ausfuehrend]
        gueltig_bis:
          type: string
          format: date-time
        fuer:
          type: string
          description: |
            Name der Person, die dieser Code übernimmt. Fehlt, wenn jemand
            Neues dazukommt.
          example: Asmae

    NeuerHaushalt:
      type: object
      required: [name, mitglieder]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Familie Bauer
        wohnform:
          type: string
          enum: [wohnung, haus]
          description: |
            Wird zurzeit von keiner Vorlage ausgewertet und deshalb auch nicht
            abgefragt — eine Frage, die nichts bewirkt, gehört nicht ins
            Onboarding. Das Feld bleibt, weil Wohnform eine echte Eigenschaft
            eines Haushalts ist; sobald eine Vorlage daran hängt (Streupflicht,
            Dachrinne, Schornsteinfeger), kommt die Frage zurück. Fehlt es,
            gilt „wohnung".
        zimmer:
          type: integer
          minimum: 1
          maximum: 15
          example: 3
          description: |
            Wie viele Zimmer. Filtert nichts, sondern skaliert: Putzaufgaben
            dauern in fünf Zimmern länger als in zwei. Fehlt die Angabe, gilt
            drei — der Haushalt, für den die Bibliothek kuratiert ist.
        baeder:
          type: integer
          minimum: 0
          maximum: 5
          example: 1
          description: |
            Wie viele Bäder. „Bad putzen" ist pro Bad gerechnet — wer zwei hat,
            putzt zwei. Fehlt die Angabe, gilt eins.
        garten:
          type: boolean
          description: Fehlt das Feld, gilt „kein Garten".
        auto:
          type: boolean
          description: |
            Entscheidet über Aufgaben wie Reifenwechsel oder TÜV. Fehlt das
            Feld, gilt „kein Auto", und die Aufgaben entstehen gar nicht erst.
        haustiere:
          type: array
          maxItems: 6
          items:
            type: string
            example: hund
        zeitzone:
          type: string
          description: |
            Bestimmt, wann ein Tag beginnt und endet. Fehlt sie, wird es
            Europe/Berlin — ein Haushalt lebt in einer Zeitzone, nicht in der
            Serverzeit. Siehe ADR-0002.
        mitglieder:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/NeuesMitglied"

    NeuesMitglied:
      type: object
      required: [name, rolle]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        rolle:
          type: string
          enum: [planend, ausfuehrend, betreut]
        geburtsjahr:
          type: integer
          minimum: 1900
          maximum: 2100
          description: |
            Nur bei Kindern nötig; es entscheidet über Altersgrenzen von
            Aufgaben. Bei Erwachsenen darf es fehlen — dann gelten sie als
            erwachsen und mehr braucht der Planer nicht zu wissen.
        zeit:
          type: string
          enum: [keine, wenig, mittel, viel]
          description: |
            Grobes Zeitbudget statt sieben Zahlen. Niemand weiß, wie viele
            Minuten Haushalt er dienstags hat; eine erfundene Zahl sieht nur
            präziser aus als eine ehrliche Stufe.

            Fehlt die Angabe, gilt „mittel"; bei betreuten Personen immer
            „keine", egal was hier steht — sie erzeugen Arbeit und übernehmen
            keine.

    Gestrichen:
      type: object
      required: [id, titel, tag]
      properties:
        id:
          type: string
        titel:
          type: string
          example: Bad putzen
        tag:
          type: string
          format: date
          x-go-type: string
          description: |
            Der Tag, an dem sie angestanden hätte. Er gehört dazu, weil
            gestrichen wird, was an EINEM Tag ansteht — eine Vorlage kann
            mehrfach in der Woche vorkommen.

    Zuteilung:
      type: object
      required: [zustaendig]
      properties:
        zustaendig:
          type: string
          description: Name der Person, die die Aufgabe jetzt hat.
          example: Mia

    Abgabe:
      type: object
      properties:
        uebernimmt:
          type: string
          description: |
            Name der Person, die übernimmt. Fehlt, wenn niemand geeignet ist —
            dann steht die Aufgabe offen im Plan.
          example: Ben

    HaushaltAenderung:
      type: object
      description: |
        Jedes Feld ist freiwillig. Was fehlt, bleibt stehen — der Unterschied
        zwischen „nicht mitgeschickt" und „geleert" ist der ganze Sinn einer
        Einstellungsseite.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        wohnform:
          type: string
          enum: [wohnung, haus]
        zimmer:
          type: integer
          minimum: 1
          maximum: 15
        baeder:
          type: integer
          minimum: 0
          maximum: 5
        garten:
          type: boolean
        auto:
          type: boolean
        haustiere:
          type: array
          maxItems: 6
          items:
            type: string
          description: Vollständige Liste. Leer heißt „keine mehr".
        zeitzone:
          type: string

    MitgliedAenderung:
      type: object
      description: Jedes Feld ist freiwillig. Was fehlt, bleibt stehen.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        rolle:
          type: string
          enum: [planend, ausfuehrend, betreut]
        geburtsjahr:
          type: integer
          minimum: 0
          maximum: 2100
          description: |
            **0 heißt „kein Geburtsjahr"** und ist bei Erwachsenen die richtige
            Antwort — nicht „im Jahr null geboren". Die Betreuungsform wird
            daraus neu geraten.
        zeit:
          type: string
          enum: [keine, wenig, mittel, viel]
          description: |
            Die grobe Stufe aus dem Onboarding. Der Dienst rechnet sie in
            Minuten um; die Minutenwerte stehen nur im Planer, damit es nicht
            zwei Vorstellungen davon gibt, was „mittel" bedeutet.
        betreuung:
          type: string
          enum: [keine, kita, schule]
          description: |
            Ausdrücklich gesetzt gewinnt gegen geraten — auch wenn in derselben
            Anfrage ein neues Geburtsjahr steht.
        minuten:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: integer
            minimum: 0
            maximum: 480
          description: |
            Minuten je Wochentag, Index 0 = Montag. Für alle, denen die drei
            Stufen zu grob sind. Zusammen mit `zeit` gewinnt diese Angabe.

    VorlagenStand:
      type: object
      required: [id, titel, kategorie, art, dauer_min, kopflast, aktiv]
      properties:
        id:
          type: string
          example: t-pflanzen
        titel:
          type: string
        kategorie:
          $ref: "#/components/schemas/Kategorie"
        art:
          type: string
          enum: [ausfuehrung, organisation]
        dauer_min:
          type: integer
        kopflast:
          type: integer
        braucht_absprache:
          type: boolean
          description: |
            Diese Aufgabe verteilt der Planer nicht — sie wird abgesprochen.
            Ohne Raster taucht sie mit dem Grund `braucht_absprache` auf.
        absprache:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: string
          description: |
            Das Wochenraster, Index 0 = Montag. Leerer Text heißt: für diesen
            Tag ist nichts abgesprochen.
        wochentage:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: boolean
          description: |
            An welchen Tagen diese Aufgabe liegt, Index 0 = Montag. Alle
            sieben falsch heißt: an keinem festen Tag — der Planer sucht sich
            im Fenster einen.

            Das ist der **geltende** Stand, nicht der der Bibliothek: Hat der
            Haushalt eigene Tage festgelegt, stehen die hier. Ob sie eigene
            sind, sagt `wochentage_eigen`.
        wochentage_eigen:
          type: boolean
          description: |
            Die Tage stammen von diesem Haushalt und nicht aus der Bibliothek.
            Ohne dieses Feld könnte die Oberfläche „zurücksetzen" nicht von
            „nichts zu tun" unterscheiden.
        wochentage_moeglich:
          type: boolean
          description: |
            Ob ein Wochentag für diese Aufgabe überhaupt eine Antwort ist.
            Falsch beim Auslöser, bei Saison und Phase und bei allem, was an
            einem Anlass hängt — dort bietet die Oberfläche die Wahl gar nicht
            erst an, statt eine `400` zu provozieren.
        voraussetzung:
          type: string
          description: |
            Bei `gilt_nicht`: die fehlende Bedingung als Satz — „Braucht ein
            Kind, das zur Schule geht." Fehlt, wenn ein verneintes Faktum die
            Ursache ist; dann steht in `frage`, was noch einmal zu fragen
            wäre.

            Gerechnet im Planer, der die Bedingung ohnehin prüft. Vorher stand
            in der Liste nur „gilt bei euch nicht" und daneben eine
            Aufzählung aller denkbaren Ursachen — eine Andeutung statt einer
            Auskunft.
          example: Braucht ein Kind, das zur Schule geht.
        haeufigkeit:
          type: string
          description: |
            Wie oft sie vorkommt, als Satz: „täglich", „3× pro Woche",
            „wöchentlich", „jährlich im Oktober".

            Gerechnet im Planer aus dem Rhythmus, nicht in der Oberfläche
            nachgebaut — dieselbe Regel wie bei `Mitglied.zeit`. Ohne diese
            Angabe fehlte in der Liste die Zahl, die über den Aufwand
            entscheidet: „Abendessen kochen, 40 Minuten" ist etwas anderes,
            wenn es dreimal die Woche dran ist.
          example: 3× pro Woche
        aktiv:
          type: boolean
          description: Ob sie in künftigen Plänen vorkommen kann.
        eigene:
          type: boolean
          description: |
            Vom Haushalt selbst angelegt. Ihre Zahlen sind geschätzt und tragen
            trotzdem die Fairnessrechnung mit — deshalb sind sie sichtbar
            gekennzeichnet.
        grund:
          type: string
          enum:
            [
              gilt_nicht,
              abgewaehlt,
              nicht_faellig,
              startdichte,
              keine_kapazitaet,
              niemand_geeignet,
              unbekannt,
              braucht_termin,
              braucht_absprache,
            ]
          description: Warum sie nicht gilt. Fehlt, wenn sie gilt.
        faktum:
          type: string
          description: Bei `unbekannt` das Faktum, dessen Antwort fehlt.
        frage:
          type: string
          description: |
            Die Frage zu diesem Faktum — mitgeliefert statt nachgeschlagen,
            damit die Zeile alles trägt, was sie zum Anzeigen braucht.
        dann:
          type: string
          description: Was eine Antwort mit Ja bringt.

    Anlass:
      type: object
      required: [id, titel, tag, art, jaehrlich]
      properties:
        id:
          type: string
        titel:
          type: string
          example: Geburtstag von Mia
        tag:
          type: string
          format: date
          x-go-type: string
          description: Kalendertag ohne Uhrzeit (ADR-0002).
          example: "2026-11-08"
        art:
          type: string
          enum: [kindergeburtstag, geburtstag, elternabend, arzttermin, sonstiges]
          description: |
            Verbindet den Anlass mit den Vorlagen, die daran hängen. Eine feste
            Liste, weil ein freier Text nie zu einer Vorlage passen würde — man
            hätte etwas eingetragen und nie erfahren, warum nichts passiert.
        jaehrlich:
          type: boolean
          description: Geburtstage wiederholen sich, Termine nicht.

    NeuerAnlass:
      type: object
      required: [titel, tag, art]
      properties:
        titel:
          type: string
          minLength: 1
          maxLength: 80
        tag:
          type: string
          format: date
          x-go-type: string
        art:
          type: string
          enum: [kindergeburtstag, geburtstag, elternabend, arzttermin, sonstiges]
        jaehrlich:
          type: boolean

    NeueVorlage:
      type: object
      required: [titel, kategorie, dauer_min, alle_tage]
      properties:
        titel:
          type: string
          minLength: 1
          maxLength: 80
          example: Medikamente für Oma sortieren
        kategorie:
          $ref: "#/components/schemas/Kategorie"
        dauer_min:
          type: integer
          minimum: 1
          maximum: 480
          description: |
            Geschätzt — und die Schätzung trägt die Fairnessrechnung mit. Eine
            zu niedrige Zahl verschiebt die Bilanz des ganzen Haushalts, ohne
            dass es jemand merkt.
        alle_tage:
          type: integer
          enum: [1, 7, 14, 30]
          description: |
            Gewünschter Abstand — täglich, wöchentlich, zweiwöchentlich oder
            monatlich.
        denken:
          type: boolean
          description: |
            „Muss jemand daran denken, oder sieht man es?" Zählt einfach in die
            Kopflast.
        klaeren:
          type: boolean
          description: |
            „Muss man erst etwas klären — Termin machen, nachsehen, jemanden
            fragen?" Zählt doppelt: Ein Termin, den man vereinbaren muss,
            kostet mehr Aufmerksamkeit als eine Aufgabe, an die man sich nur
            erinnert.
        nur_erwachsene:
          type: boolean
        braucht_absprache:
          type: boolean
          description: |
            „Muss festgelegt werden, wer wann?" Dann verteilt der Planer die
            Aufgabe nicht, sondern fordert ein Wochenraster ein.

            Für alles, was am Arbeitsplan hängt statt an freier Zeit — ein
            Kind bringen oder abholen, ein Termin, zu dem jemand hin muss. Der
            Planer kennt die Kapazität und nicht den Kalender; ohne Absprache
            teilt er mit voller Überzeugung den Falschen ein.

    Frage:
      type: object
      required: [faktum, frage, dann]
      properties:
        faktum:
          type: string
          example: pflanzen
        frage:
          type: string
          example: Habt ihr Pflanzen, die gegossen werden müssen?
        dann:
          type: string
          description: Was eine Antwort mit Ja bringt.
          example: Dann erinnere ich alle paar Tage ans Gießen.

    Haushalt:
      type: object
      required: [id, name, mitglieder]
      properties:
        id:
          type: string
          example: familie-a
        name:
          type: string
          example: Familie A
        mitglieder:
          type: array
          items:
            $ref: "#/components/schemas/Mitglied"
        meine_rolle:
          type: string
          enum: [planend, ausfuehrend, betreut]
          description: |
            Die Rolle des Aufrufers in diesem Haushalt. Fehlt bei den
            öffentlichen Beispielhaushalten und überall dort, wo er nicht
            Mitglied ist.
        ich:
          type: string
          description: |
            Kennung des Aufrufers als Person in diesem Haushalt. Damit weiß die
            Ansicht, welche Zeile seine eigene ist — etwa in den Einstellungen,
            wo jeder seine eigene Zeit setzen darf und sonst nichts.
        wohnform:
          type: string
          enum: [wohnung, haus]
        garten:
          type: boolean
        auto:
          type: boolean
        haustiere:
          type: array
          items:
            type: string
          description: |
            Garten, Auto und Haustiere entscheiden, welche Aufgaben es im
            Haushalt überhaupt gibt — ohne Garten kein Rasen, ohne Auto kein
            TÜV. Ohne diese Felder könnten die Einstellungen nicht zeigen, was
            angenommen wurde.
        zimmer:
          type: integer
        baeder:
          type: integer

    Mitglied:
      type: object
      required: [id, name, rolle]
      properties:
        id:
          type: string
          example: m-anna
        name:
          type: string
          example: Anna
        rolle:
          type: string
          enum: [planend, ausfuehrend, betreut]
          description: |
            `planend` plant und führt aus, `ausfuehrend` führt nur aus,
            `betreut` erzeugt Arbeit ohne welche zu übernehmen.
        hat_zugang:
          type: boolean
          description: |
            Ob diese Person sich anmelden kann. Steuert, wen man noch einladen
            kann — und macht sichtbar, wer bisher nur im Plan steht.
        geburtsjahr:
          type: integer
          description: |
            Fehlt bei Erwachsenen — dort ist „nicht gefragt" die richtige
            Antwort und nicht „unbekannt alt" (siehe Member.IsAdult im Planer).
        minuten:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: integer
          description: |
            Verfügbare Minuten je Wochentag, Index 0 = Montag. Beim Einrichten
            aus einer der drei Stufen geraten und hier korrigierbar. Die Zahlen
            tragen die gesamte Verteilung — deshalb stehen sie sichtbar da.
        zeit:
          type: string
          enum: [keine, wenig, mittel, viel]
          description: |
            Die Stufe, zu der diese Minuten gehören. **Fehlt, wenn keine
            genau passt** — dann hat jemand die Minuten von Hand gesetzt, und
            das ist ein eigener gültiger Zustand. Die nächstgelegene Stufe
            zurückzugeben wäre eine Behauptung über eine Absicht, die niemand
            geäußert hat.

            Ausgerechnet wird sie im Planer (`BudgetOf`), nicht in der
            Oberfläche: Welche Minuten „mittel" bedeutet, weiß genau eine
            Stelle im System. Eine nachgebaute Zuordnung wäre eine zweite
            Wahrheit — und die zweite ist immer die, die niemand pflegt.
        betreuung:
          type: string
          enum: [keine, kita, schule]
          description: |
            Beim Einrichten aus dem Alter geraten und hier korrigierbar. An ihr
            hängt, welche Aufgaben der Haushalt überhaupt hat — ohne Kita-Kind
            keine Kita-Tasche.

    Wochenplan:
      type: object
      required: [woche, haushalt, aufgaben, uebersprungen]
      properties:
        woche:
          type: string
          example: 2026-W38
        haushalt:
          $ref: "#/components/schemas/Haushalt"
        aufgaben:
          type: array
          items:
            $ref: "#/components/schemas/Aufgabe"
        gestrichen:
          type: array
          description: |
            Einzelne Termine, die jemand gestrichen hat — nicht Vorlagen. Aus
            Plan und Bilanz sind sie raus; hier stehen sie, damit die App einen
            Weg zurück anbieten kann. Eine Zeile, die wortlos verschwindet,
            lässt jemanden, der sich vertippt hat, ohne Rückweg.
          items:
            $ref: "#/components/schemas/Gestrichen"
        meine_rolle:
          type: string
          enum: [planend, ausfuehrend, betreut]
          nullable: true
          description: |
            Die Rolle des Aufrufers in diesem Haushalt. Fehlt bei
            Demo-Haushalten und ohne Anmeldung.
        ich:
          type: string
          description: |
            Kennung des Aufrufers als Person in diesem Haushalt. Damit erkennt
            die Ansicht, welche Zeile seine ist — und ob er eine Aufgabe
            abgeben darf. Fehlt bei Demo-Haushalten und ohne Anmeldung.
        fragen:
          type: array
          items:
            $ref: "#/components/schemas/Frage"
          description: |
            Offene Fragen zum Haushalt — höchstens zwei. Was die App nicht
            weiß, plant sie nicht ein; sie fragt danach, und zwar mit dem
            Nutzen daneben. Eine Frage ohne erkennbaren Nutzen wird nicht
            beantwortet.
        bilanz:
          type: array
          description: |
            Eine Zeile je Person, die Aufgaben übernehmen kann — **nur für
            planende Personen**. Wer ausführt, sieht den ganzen Plan, aber
            nicht die Auswertung darüber, wer im Haushalt wie viel trägt.

            Fehlt das Feld, ist das kein Fehler: Der Aufrufer darf es nicht
            sehen. Demo-Haushalte liefern es mit, sie haben nichts zu
            verbergen.
          items:
            $ref: "#/components/schemas/Bilanz"
        uebersprungen:
          type: array
          description: |
            Was nicht im Plan steht, mit Grund. Ohne dieses Feld könnte die
            App nicht erklären, warum etwas fehlt.
          items:
            $ref: "#/components/schemas/Uebersprungen"

    Aufgabe:
      type: object
      required:
        [vorlage_id, titel, kategorie, art, tag, zeitfenster, dauer_min, kopflast, zustaendig, begruendung]
      properties:
        id:
          type: string
          description: |
            Kennung der festgeschriebenen Aufgabe. Fehlt bei den öffentlichen
            Beispielhaushalten: Deren Wochen werden gerechnet und nicht
            geschrieben, es gibt also nichts, woran ein „erledigt" hängen
            könnte.
        erledigt:
          type: boolean
          description: Ob jemand sie abgehakt hat.
        vorlage_id:
          type: string
          example: t-bad
        titel:
          type: string
          example: Bad putzen
        kategorie:
          $ref: "#/components/schemas/Kategorie"
        art:
          type: string
          enum: [ausfuehrung, organisation]
        tag:
          type: string
          format: date
          x-go-type: string
          description: |
            Kalendertag ohne Uhrzeit und ohne Zeitzone (ADR-0002). Über die
            Grenze geht die ISO-Zeichenkette; die Anzeige rechnet sie in
            Europe/Berlin um.
          example: "2026-09-19"
        zeitfenster:
          type: string
          enum: [egal, morgens, abends]
        dauer_min:
          type: integer
          minimum: 1
          example: 35
        kopflast:
          type: integer
          minimum: 0
          maximum: 3
          description: Planungs- und Erinnerungsaufwand, unabhängig von der Dauer
        zustaendig:
          type: string
          description: |
            Kennung des Mitglieds. Leer, wenn niemand zuständig ist — der
            Zustand einer abgegebenen Aufgabe, die noch niemand übernommen
            hat. Sichtbar offen zu sein ist Absicht.
          example: m-ben
        frist:
          type: string
          format: date
          x-go-type: string
          nullable: true
          description: gesetzt, wenn die Aufgabe eine echte Frist hat
        begruendung:
          $ref: "#/components/schemas/Begruendung"

    Begruendung:
      type: object
      required: [code]
      description: |
        Maschinenlesbar. Das Sprachmodell formuliert daraus später einen Satz
        für die Oberfläche — es erfindet keine Begründung, es übersetzt eine.
      properties:
        code:
          type: string
          enum:
            [rotation, ausgleich, feste_person, einzige_moeglichkeit, frist, eigene_aufgabe, von_hand, absprache]
        zuletzt_bei:
          type: string
          nullable: true
          description: bei `rotation` die Person, die die Aufgabe zuletzt hatte

    Bilanz:
      type: object
      required:
        [mitglied_id, minuten, kopflast, gewichtet, kapazitaet_minuten, auslastung_prozent, aufgaben]
      properties:
        mitglied_id:
          type: string
        minuten:
          type: integer
        kopflast:
          type: integer
        gewichtet:
          type: integer
          description: Minuten + Kopflast × 15
        kapazitaet_minuten:
          type: integer
          description: verfügbare Minuten der ganzen Woche
        auslastung_prozent:
          type: integer
          description: |
            Verplante Minuten im Verhältnis zur verfügbaren Zeit. Gerechnet
            wird mit den reinen Minuten — Kopflast kostet Aufmerksamkeit,
            aber keine Uhrzeit (ADR-0004).
        aufgaben:
          type: integer

    Uebersprungen:
      type: object
      required: [vorlage_id, titel, grund]
      properties:
        vorlage_id:
          type: string
        titel:
          type: string
        grund:
          type: string
          # Dasselbe Vokabular wie VorlagenStand.grund — planner.AllSkipCodes.
          # Diese Liste war lange unvollständig (ohne `unbekannt` und
          # `braucht_termin`), und niemand merkte es, weil die Oberfläche die
          # Werte nur nachschlug statt sie zu vergleichen. Ein Test in
          # internal/httpapi hält beide Listen jetzt am Planer fest.
          enum:
            [
              gilt_nicht,
              abgewaehlt,
              nicht_faellig,
              startdichte,
              keine_kapazitaet,
              niemand_geeignet,
              unbekannt,
              braucht_termin,
              braucht_absprache,
            ]

    Rueckmeldung:
      type: object
      required: [id, art, text, gemeldet_am]
      properties:
        id:
          type: string
        art:
          type: string
          enum: [fehler, idee, stoert]
          description: |
            Drei und nicht zwei: „Fehler" und „Idee" sind die üblichen, und
            dazwischen fällt das Wichtigste durch. `stoert` ist kein Fehler —
            die App tut, was sie soll — und keine Idee, weil niemand eine
            Lösung anzubieten hat. Genau diese Sätze führen dazu, dass jemand
            eine App am Mittwoch zuklappt.
        text:
          type: string
        kontext:
          type: string
          description: Seite, Woche und Fassung — von der Oberfläche gesammelt.
        wer:
          type: string
          description: |
            Name der meldenden Person. Fehlt, wenn sie den Haushalt verlassen
            hat: Die Rückmeldung bleibt wahr, auch wenn niemand mehr
            danebensteht.
        gemeldet_am:
          type: string
          format: date-time

    Kategorie:
      type: string
      enum:
        [kueche, waesche, reinigung, kind, vorrat, termine, verwaltung, wartung, sozial, aussen]
