openapi: 3.0.3

info:
  title: Haushalt API
  version: 0.1.0
  description: |
    Der Vertrag zwischen der Web-App und dem Go-Dienst.

    Diese Datei ist die Wahrheit: Go-Typen und Server-Rümpfe werden daraus
    erzeugt (`make generate` in `api/`), der TypeScript-Client ebenso
    (`npm run generate` in `web/`). Wer ein Feld ändert, ändert es hier —
    alles andere folgt.

    Feldnamen sind deutsch und in Kleinschreibung mit Unterstrich, wie in
    der Vorlagen-Bibliothek. Die Domäne ist deutsch; eine halb übersetzte
    API wäre in beiden Sprachen falsch.

    `/healthz` steht bewusst nicht hier. Es gehört der Plattform, nicht dem
    Vertrag: Fly ruft es auf, kein Client.

servers:
  - url: https://haushalt-api.fly.dev
    description: Produktion
  - url: http://localhost:8080
    description: lokal

tags:
  - name: plan
    description: Wochenpläne
  - name: haushalt
    description: Mitgliedschaft und Einladungen
  - name: meta
    description: Auskunft über den laufenden Dienst

paths:
  /api/version:
    get:
      tags: [meta]
      summary: Welcher Stand läuft gerade
      operationId: getVersion
      responses:
        "200":
          description: die Commit-Kennung des laufenden Dienstes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"

  /api/ich:
    get:
      tags: [meta]
      summary: Wer fragt
      description: |
        Beantwortet, was das mitgeschickte Token beweist — und nicht mehr.
        Ohne Token ist `angemeldet` false; das ist kein Fehler, sondern die
        Antwort. Die Demo-Haushalte sind ohne Anmeldung sichtbar.
      operationId: getIch
      responses:
        "200":
          description: die Identität des Aufrufers, soweit belegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ich"

  /api/haushalte:
    get:
      tags: [plan]
      summary: Verfügbare Haushalte
      description: |
        Die öffentlichen Beispielhaushalte und, wer angemeldet ist, die
        eigenen. Nur bei den eigenen ist `meine_rolle` gesetzt — eine Liste
        ohne einen solchen Eintrag heißt: dieser Mensch hat noch keinen
        Haushalt und gehört ins Onboarding.
      operationId: listHaushalte
      responses:
        "200":
          description: alle sichtbaren Haushalte
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Haushalt"

    post:
      tags: [haushalt]
      summary: Haushalt einrichten
      description: |
        Legt einen Haushalt samt Mitgliedern an und macht den Aufrufer darin
        planend. Alles in einem Aufruf und in einer Transaktion: Ein
        Onboarding, das nach dem zweiten Schritt abbricht, darf keinen halben
        Haushalt hinterlassen.

        Gefragt wird nur, was der Planer wirklich braucht — Wohnform, Personen
        mit grobem Alter, Zeitbudget. Alles Weitere ist Vorgabe und später
        änderbar. Eine App gegen Mental Load darf beim Einrichten keine
        erzeugen.
      operationId: createHaushalt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NeuerHaushalt"
      responses:
        "201":
          description: der angelegte Haushalt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Haushalt"
        "400":
          description: die Eingabe ergibt keinen Haushalt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "401":
          description: dafür muss man angemeldet sein
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/haushalte/{haushaltId}/plan/{woche}:
    get:
      tags: [plan]
      summary: Wochenplan eines Haushalts
      operationId: getWochenplan
      parameters:
        - name: haushaltId
          in: path
          required: true
          description: Kennung des Haushalts, z. B. `familie-a`
          schema:
            type: string
        - name: woche
          in: path
          required: true
          description: ISO-Kalenderwoche, Montag als erster Tag
          schema:
            type: string
            pattern: '^\d{4}-W\d{2}$'
            example: 2026-W38
      responses:
        "200":
          description: der berechnete Plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wochenplan"
        "400":
          description: die Woche ist nicht lesbar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: diesen Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/haushalte/{haushaltId}/einladungen:
    post:
      tags: [haushalt]
      summary: Jemanden einladen
      description: |
        Erzeugt einen einmalig gültigen Code. Nur planende Personen dürfen das.

        Die Rolle wird beim Einladen festgelegt und nicht beim Beitritt: Wer
        dazukommt, soll nicht selbst entscheiden, was er im Haushalt darf.
      operationId: createEinladung
      parameters:
        - name: haushaltId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rolle:
                  type: string
                  enum: [planend, ausfuehrend]
                  description: |
                    Nötig, wenn jemand dazukommt, den es im Haushalt noch nicht
                    gibt. Zusammen mit `mitglied` wird sie ignoriert: Diese
                    Person hat ihre Rolle bereits, und der Plan rechnet damit.
                mitglied:
                  type: string
                  description: |
                    Kennung einer Person, die schon im Plan steht, aber noch
                    kein Konto hat. Der Code macht den Eingeladenen dann zu
                    genau dieser Person — mit ihren Aufgaben, ihrem Verlauf und
                    ihrer Kapazität, statt eine zweite gleichen Namens
                    anzulegen.
      responses:
        "201":
          description: der Code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Einladung"
        "403":
          description: nur planende Personen dürfen einladen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: diesen Haushalt gibt es nicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

  /api/einladungen/{code}/annehmen:
    post:
      tags: [haushalt]
      summary: Einer Einladung folgen
      description: |
        Verbindet die angemeldete Person mit dem Haushalt aus der Einladung.
        Ein Code gilt einmal und läuft ab.
      operationId: acceptEinladung
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: der Haushalt, zu dem die Person jetzt gehört
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Haushalt"
        "401":
          description: dafür muss man angemeldet sein
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "404":
          description: den Code gibt es nicht, er ist abgelaufen oder verbraucht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"

components:
  schemas:

    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: kurze Commit-Kennung oder "dev"
          example: f18a432

    Ich:
      type: object
      required: [angemeldet]
      description: |
        Absichtlich schmal: Hier steht nur, was der Aussteller signiert hat.
        Welche Person in welchem Haushalt dahintersteckt, ist eine Frage an die
        Datenbank und kommt mit dem Onboarding dazu.
      properties:
        angemeldet:
          type: boolean
        subject:
          type: string
          nullable: true
          description: Nutzerkennung des Anmeldedienstes
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true

    Fehler:
      type: object
      required: [fehler]
      properties:
        fehler:
          type: string
          description: für Menschen lesbar, deutsch
          example: die Woche "2026-W99" liegt außerhalb von 1..53

    Einladung:
      type: object
      required: [code, rolle, gueltig_bis]
      properties:
        code:
          type: string
          example: K7MQ2XPD
        rolle:
          type: string
          enum: [planend, ausfuehrend]
        gueltig_bis:
          type: string
          format: date-time
        fuer:
          type: string
          description: |
            Name der Person, die dieser Code übernimmt. Fehlt, wenn jemand
            Neues dazukommt.
          example: Asmae

    NeuerHaushalt:
      type: object
      required: [name, wohnform, mitglieder]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Familie Bauer
        wohnform:
          type: string
          enum: [wohnung, haus]
        garten:
          type: boolean
          description: Fehlt das Feld, gilt „kein Garten".
        auto:
          type: boolean
          description: |
            Entscheidet über Aufgaben wie Reifenwechsel oder TÜV. Fehlt das
            Feld, gilt „kein Auto", und die Aufgaben entstehen gar nicht erst.
        haustiere:
          type: array
          maxItems: 6
          items:
            type: string
            example: hund
        zeitzone:
          type: string
          description: |
            Bestimmt, wann ein Tag beginnt und endet. Fehlt sie, wird es
            Europe/Berlin — ein Haushalt lebt in einer Zeitzone, nicht in der
            Serverzeit. Siehe ADR-0002.
        mitglieder:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/NeuesMitglied"

    NeuesMitglied:
      type: object
      required: [name, rolle]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        rolle:
          type: string
          enum: [planend, ausfuehrend, betreut]
        geburtsjahr:
          type: integer
          minimum: 1900
          maximum: 2100
          description: |
            Nur bei Kindern nötig; es entscheidet über Altersgrenzen von
            Aufgaben. Bei Erwachsenen darf es fehlen — dann gelten sie als
            erwachsen und mehr braucht der Planer nicht zu wissen.
        zeit:
          type: string
          enum: [keine, wenig, mittel, viel]
          description: |
            Grobes Zeitbudget statt sieben Zahlen. Niemand weiß, wie viele
            Minuten Haushalt er dienstags hat; eine erfundene Zahl sieht nur
            präziser aus als eine ehrliche Stufe.

            Fehlt die Angabe, gilt „mittel"; bei betreuten Personen immer
            „keine", egal was hier steht — sie erzeugen Arbeit und übernehmen
            keine.

    Haushalt:
      type: object
      required: [id, name, mitglieder]
      properties:
        id:
          type: string
          example: familie-a
        name:
          type: string
          example: Familie A
        mitglieder:
          type: array
          items:
            $ref: "#/components/schemas/Mitglied"
        meine_rolle:
          type: string
          enum: [planend, ausfuehrend, betreut]
          description: |
            Die Rolle des Aufrufers in diesem Haushalt. Fehlt bei den
            öffentlichen Beispielhaushalten und überall dort, wo er nicht
            Mitglied ist.

    Mitglied:
      type: object
      required: [id, name, rolle]
      properties:
        id:
          type: string
          example: m-anna
        name:
          type: string
          example: Anna
        rolle:
          type: string
          enum: [planend, ausfuehrend, betreut]
          description: |
            `planend` plant und führt aus, `ausfuehrend` führt nur aus,
            `betreut` erzeugt Arbeit ohne welche zu übernehmen.
        hat_zugang:
          type: boolean
          description: |
            Ob diese Person sich anmelden kann. Steuert, wen man noch einladen
            kann — und macht sichtbar, wer bisher nur im Plan steht.

    Wochenplan:
      type: object
      required: [woche, haushalt, aufgaben, uebersprungen]
      properties:
        woche:
          type: string
          example: 2026-W38
        haushalt:
          $ref: "#/components/schemas/Haushalt"
        aufgaben:
          type: array
          items:
            $ref: "#/components/schemas/Aufgabe"
        meine_rolle:
          type: string
          enum: [planend, ausfuehrend, betreut]
          nullable: true
          description: |
            Die Rolle des Aufrufers in diesem Haushalt. Fehlt bei
            Demo-Haushalten und ohne Anmeldung.
        bilanz:
          type: array
          description: |
            Eine Zeile je Person, die Aufgaben übernehmen kann — **nur für
            planende Personen**. Wer ausführt, sieht den ganzen Plan, aber
            nicht die Auswertung darüber, wer im Haushalt wie viel trägt.

            Fehlt das Feld, ist das kein Fehler: Der Aufrufer darf es nicht
            sehen. Demo-Haushalte liefern es mit, sie haben nichts zu
            verbergen.
          items:
            $ref: "#/components/schemas/Bilanz"
        uebersprungen:
          type: array
          description: |
            Was nicht im Plan steht, mit Grund. Ohne dieses Feld könnte die
            App nicht erklären, warum etwas fehlt.
          items:
            $ref: "#/components/schemas/Uebersprungen"

    Aufgabe:
      type: object
      required:
        [vorlage_id, titel, kategorie, art, tag, zeitfenster, dauer_min, kopflast, zustaendig, begruendung]
      properties:
        vorlage_id:
          type: string
          example: t-bad
        titel:
          type: string
          example: Bad putzen
        kategorie:
          $ref: "#/components/schemas/Kategorie"
        art:
          type: string
          enum: [ausfuehrung, organisation]
        tag:
          type: string
          format: date
          x-go-type: string
          description: |
            Kalendertag ohne Uhrzeit und ohne Zeitzone (ADR-0002). Über die
            Grenze geht die ISO-Zeichenkette; die Anzeige rechnet sie in
            Europe/Berlin um.
          example: "2026-09-19"
        zeitfenster:
          type: string
          enum: [egal, morgens, abends]
        dauer_min:
          type: integer
          minimum: 1
          example: 35
        kopflast:
          type: integer
          minimum: 0
          maximum: 3
          description: Planungs- und Erinnerungsaufwand, unabhängig von der Dauer
        zustaendig:
          type: string
          description: Kennung des Mitglieds
          example: m-ben
        frist:
          type: string
          format: date
          x-go-type: string
          nullable: true
          description: gesetzt, wenn die Aufgabe eine echte Frist hat
        begruendung:
          $ref: "#/components/schemas/Begruendung"

    Begruendung:
      type: object
      required: [code]
      description: |
        Maschinenlesbar. Das Sprachmodell formuliert daraus später einen Satz
        für die Oberfläche — es erfindet keine Begründung, es übersetzt eine.
      properties:
        code:
          type: string
          enum:
            [rotation, ausgleich, feste_person, einzige_moeglichkeit, frist, eigene_aufgabe]
        zuletzt_bei:
          type: string
          nullable: true
          description: bei `rotation` die Person, die die Aufgabe zuletzt hatte

    Bilanz:
      type: object
      required:
        [mitglied_id, minuten, kopflast, gewichtet, kapazitaet_minuten, auslastung_prozent, aufgaben]
      properties:
        mitglied_id:
          type: string
        minuten:
          type: integer
        kopflast:
          type: integer
        gewichtet:
          type: integer
          description: Minuten + Kopflast × 15
        kapazitaet_minuten:
          type: integer
          description: verfügbare Minuten der ganzen Woche
        auslastung_prozent:
          type: integer
          description: |
            Verplante Minuten im Verhältnis zur verfügbaren Zeit. Gerechnet
            wird mit den reinen Minuten — Kopflast kostet Aufmerksamkeit,
            aber keine Uhrzeit (ADR-0004).
        aufgaben:
          type: integer

    Uebersprungen:
      type: object
      required: [vorlage_id, titel, grund]
      properties:
        vorlage_id:
          type: string
        titel:
          type: string
        grund:
          type: string
          enum:
            [gilt_nicht, abgewaehlt, nicht_faellig, startdichte, keine_kapazitaet, niemand_geeignet]

    Kategorie:
      type: string
      enum:
        [kueche, waesche, reinigung, kind, vorrat, termine, verwaltung, wartung, sozial, aussen]
